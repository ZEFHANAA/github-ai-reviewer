<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">GitHub AI Reviewer architecture</title>
  <desc id="desc">Browser submits a repository URL to Laravel. Laravel retrieves GitHub data, produces a bounded snapshot, runs deterministic analysis and scoring, optionally adds safe AI enrichment, persists results, and renders a Blade report.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#94a3b8"/></marker>
    <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e2e8f0}.name{font-size:15px;font-weight:700}.sub{font-size:11px;fill:#94a3b8}.label{font-size:10px;fill:#cbd5e1}.box{stroke-width:2}.flow{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}.optional{fill:none;stroke:#fb7185;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="660" fill="#020617"/><rect width="1200" height="660" fill="url(#grid)"/>
  <text x="52" y="55" class="name" font-size="24">GitHub AI Reviewer</text><text x="52" y="78" class="sub">Current Laravel monolith — Phase 10 documentation artifact</text>
  <path class="flow" d="M205 230H270"/><path class="flow" d="M455 230H520"/><path class="flow" d="M705 230H770"/><path class="flow" d="M955 230H1020"/>
  <path class="flow" d="M612 290V380"/><path class="flow" d="M862 290V380"/><path class="flow" d="M705 465H770"/><path class="flow" d="M955 465H1020"/>
  <path class="optional" d="M862 290V115H1020"/>
  <g><rect x="55" y="185" width="150" height="90" rx="10" fill="#083344" stroke="#22d3ee" class="box"/><text x="130" y="222" text-anchor="middle" class="name">Browser</text><text x="130" y="245" text-anchor="middle" class="sub">submit URL / view report</text></g>
  <g><rect x="270" y="185" width="185" height="90" rx="10" fill="#064e3b" stroke="#34d399" class="box"/><text x="362" y="220" text-anchor="middle" class="name">Laravel Controller</text><text x="362" y="244" text-anchor="middle" class="sub">validation · rate limit</text></g>
  <g><rect x="520" y="185" width="185" height="90" rx="10" fill="#1e293b" stroke="#94a3b8" class="box"/><text x="612" y="220" text-anchor="middle" class="name">GitHub Service</text><text x="612" y="244" text-anchor="middle" class="sub">metadata + bounded contents</text></g>
  <g><rect x="770" y="185" width="185" height="90" rx="10" fill="#064e3b" stroke="#34d399" class="box"/><text x="862" y="220" text-anchor="middle" class="name">RepositorySnapshot</text><text x="862" y="244" text-anchor="middle" class="sub">paths · availability · budget</text></g>
  <g><rect x="1020" y="185" width="130" height="90" rx="10" fill="#1e293b" stroke="#94a3b8" class="box"/><text x="1085" y="222" text-anchor="middle" class="name">GitHub API</text><text x="1085" y="245" text-anchor="middle" class="sub">external</text></g>
  <g><rect x="520" y="380" width="185" height="90" rx="10" fill="#064e3b" stroke="#34d399" class="box"/><text x="612" y="415" text-anchor="middle" class="name">Deterministic Analysis</text><text x="612" y="439" text-anchor="middle" class="sub">typed findings + scoring</text></g>
  <g><rect x="770" y="380" width="185" height="90" rx="10" fill="#064e3b" stroke="#34d399" class="box"/><text x="862" y="415" text-anchor="middle" class="name">Safe AI Review</text><text x="862" y="439" text-anchor="middle" class="sub">optional; cannot change score</text></g>
  <g><rect x="1020" y="380" width="130" height="90" rx="10" fill="#1e293b" stroke="#94a3b8" class="box"/><text x="1085" y="415" text-anchor="middle" class="name">AI Provider</text><text x="1085" y="439" text-anchor="middle" class="sub">fake or remote</text></g>
  <g><rect x="770" y="525" width="185" height="80" rx="10" fill="#4c1d95" stroke="#a78bfa" class="box"/><text x="862" y="557" text-anchor="middle" class="name">SQLite Persistence</text><text x="862" y="580" text-anchor="middle" class="sub">repository · analysis · findings</text></g>
  <g><rect x="1020" y="525" width="130" height="80" rx="10" fill="#083344" stroke="#22d3ee" class="box"/><text x="1085" y="557" text-anchor="middle" class="name">Blade Report</text><text x="1085" y="580" text-anchor="middle" class="sub">escaped output</text></g>
  <text x="52" y="630" class="label">Solid: application flow. Dashed: optional AI enrichment. No queue, cache, OAuth, or deployment infrastructure is shown because none exists in current code.</text>
</svg>
